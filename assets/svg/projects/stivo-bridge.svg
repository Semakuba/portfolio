<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bg-stivo" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(0.930 0.040 75)" />
      <stop offset="100%" stop-color="oklch(0.850 0.080 75)" />
    </linearGradient>
    <linearGradient id="receipt-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="oklch(0.990 0.005 75)" />
      <stop offset="100%" stop-color="oklch(0.955 0.015 75)" />
    </linearGradient>
    <filter id="clay-shadow-stivo" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="oklch(0.24 0.02 75 / 0.10)" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="oklch(0.24 0.02 75 / 0.05)" />
    </filter>
  </defs>

  <!-- Fond subtil -->
  <rect width="800" height="500" fill="url(#bg-stivo)" />

  <!-- Trame de flux d'impression vectoriel -->
  <g opacity="0.30" stroke="oklch(0.650 0.120 75)" stroke-width="2" stroke-linecap="round">
    <line x1="140" y1="120" x2="280" y2="120" stroke-dasharray="6 6" />
    <line x1="140" y1="160" x2="240" y2="160" stroke-dasharray="6 6" />
    <line x1="520" y1="360" x2="660" y2="360" stroke-dasharray="6 6" />
    <line x1="560" y1="400" x2="660" y2="400" stroke-dasharray="6 6" />
    <circle cx="210" cy="340" r="48" stroke-dasharray="4 8" fill="none" />
    <circle cx="590" cy="170" r="36" stroke-dasharray="4 8" fill="none" />
  </g>

  <!-- Ticket thermique découpé et stylisé -->
  <g filter="url(#clay-shadow-stivo)">
    <path d="M 280 80 H 520 V 380 L 505 372 L 490 380 L 475 372 L 460 380 L 445 372 L 430 380 L 415 372 L 400 380 L 385 372 L 370 380 L 355 372 L 340 380 L 325 372 L 310 380 L 295 372 L 280 380 Z" fill="url(#receipt-paper)" stroke="oklch(1 0 0 / 0.5)" stroke-width="1.5" />
    
    <!-- En-tête ticket thermique -->
    <rect x="360" y="115" width="80" height="12" rx="6" fill="oklch(0.55 0.12 75)" />
    <rect x="330" y="135" width="140" height="6" rx="3" fill="oklch(0.40 0.03 75)" opacity="0.6" />
    
    <line x1="310" y1="160" x2="490" y2="160" stroke="oklch(0.70 0.04 75)" stroke-width="1.5" stroke-dasharray="4 4" />
    
    <!-- Lignes de reçu -->
    <rect x="310" y="185" width="110" height="8" rx="4" fill="oklch(0.35 0.02 75)" opacity="0.8" />
    <rect x="445" y="185" width="45" height="8" rx="4" fill="oklch(0.35 0.02 75)" opacity="0.8" />
    
    <rect x="310" y="210" width="90" height="8" rx="4" fill="oklch(0.45 0.02 75)" opacity="0.7" />
    <rect x="455" y="210" width="35" height="8" rx="4" fill="oklch(0.45 0.02 75)" opacity="0.7" />

    <rect x="310" y="235" width="125" height="8" rx="4" fill="oklch(0.45 0.02 75)" opacity="0.7" />
    <rect x="450" y="235" width="40" height="8" rx="4" fill="oklch(0.45 0.02 75)" opacity="0.7" />

    <line x1="310" y1="265" x2="490" y2="265" stroke="oklch(0.70 0.04 75)" stroke-width="1.5" />
    
    <!-- Total & code-barres simulé -->
    <rect x="310" y="285" width="70" height="10" rx="5" fill="oklch(0.30 0.02 75)" />
    <rect x="435" y="285" width="55" height="10" rx="5" fill="oklch(0.55 0.12 75)" />

    <g opacity="0.75" transform="translate(325, 318)">
      <rect x="0" y="0" width="3" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="6" y="0" width="6" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="16" y="0" width="2" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="22" y="0" width="7" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="33" y="0" width="4" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="42" y="0" width="8" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="54" y="0" width="2" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="60" y="0" width="6" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="70" y="0" width="3" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="77" y="0" width="8" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="89" y="0" width="4" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="97" y="0" width="6" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="107" y="0" width="2" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="113" y="0" width="8" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="125" y="0" width="5" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="134" y="0" width="4" height="30" fill="oklch(0.30 0.02 75)" />
      <rect x="142" y="0" width="6" height="30" fill="oklch(0.30 0.02 75)" />
    </g>
  </g>
</svg>
