<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" fill="none">
  <defs>
    <linearGradient id="bg-pos" x1="0" y1="0" x2="800" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="oklch(0.925 0.040 25)" />
      <stop offset="100%" stop-color="oklch(0.840 0.080 25)" />
    </linearGradient>
    <linearGradient id="clay-pos-device" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(0.985 0.010 25)" />
      <stop offset="100%" stop-color="oklch(0.935 0.025 25)" />
    </linearGradient>
    <linearGradient id="pos-coral" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="oklch(0.680 0.150 25)" />
      <stop offset="100%" stop-color="oklch(0.550 0.130 25)" />
    </linearGradient>
    <filter id="clay-shadow-pos" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="oklch(0.24 0.02 25 / 0.10)" />
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="oklch(0.24 0.02 25 / 0.05)" />
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="800" height="500" fill="url(#bg-pos)" />

  <!-- Signaux Bluetooth et matrice de points raster ESC/POS -->
  <g opacity="0.30" stroke="oklch(0.680 0.150 25)" stroke-width="2" stroke-linecap="round">
    <path d="M 120 180 C 145 200, 145 250, 120 270" stroke-width="3" fill="none" />
    <path d="M 100 160 C 135 190, 135 260, 100 290" stroke-width="3" fill="none" />
    <path d="M 680 180 C 655 200, 655 250, 680 270" stroke-width="3" stroke-dasharray="6 6" fill="none" />
    <path d="M 700 160 C 665 190, 665 260, 700 290" stroke-width="3" stroke-dasharray="6 6" fill="none" />
  </g>

  <!-- Imprimante de caisse thermique & interface ESC/POS -->
  <g filter="url(#clay-shadow-pos)">
    <!-- Boîtier principal de l'imprimante thermique -->
    <rect x="250" y="140" width="300" height="230" rx="22" fill="url(#clay-pos-device)" stroke="oklch(1 0 0 / 0.5)" stroke-width="1.5" />
    
    <!-- Fente de sortie du papier -->
    <rect x="285" y="160" width="230" height="12" rx="6" fill="oklch(0.30 0.02 25)" />
    
    <!-- Ticket émergeant de l'imprimante -->
    <rect x="305" y="90" width="190" height="75" rx="8" fill="oklch(0.990 0.005 25)" stroke="oklch(0.90 0.015 25)" />
    <rect x="325" y="105" width="80" height="6" rx="3" fill="oklch(0.40 0.02 25)" opacity="0.8" />
    <rect x="325" y="117" width="150" height="4" rx="2" fill="oklch(0.55 0.02 25)" opacity="0.6" />
    <rect x="325" y="127" width="110" height="4" rx="2" fill="oklch(0.55 0.02 25)" opacity="0.6" />
    <rect x="325" y="137" width="135" height="4" rx="2" fill="oklch(0.55 0.02 25)" opacity="0.6" />
    
    <!-- Bouton Feed / Power clay -->
    <circle cx="475" cy="220" r="16" fill="url(#pos-coral)" />
    <circle cx="475" cy="220" r="6" fill="oklch(0.99 0.005 25)" opacity="0.9" />

    <!-- Voyant Bluetooth et statut d'alimentation -->
    <circle cx="305" cy="220" r="5" fill="oklch(0.650 0.120 225)" />
    <circle cx="325" cy="220" r="5" fill="oklch(0.660 0.130 150)" />
    <rect x="345" y="217" width="80" height="6" rx="3" fill="oklch(0.60 0.02 25)" opacity="0.5" />

    <!-- Matrice raster ESC/POS simulée -->
    <g opacity="0.65" transform="translate(295, 260)">
      <rect x="0" y="0" width="210" height="80" rx="12" fill="oklch(0.92 0.02 25)" />
      <!-- Grille de pixels bitmap raster -->
      <g fill="oklch(0.40 0.02 25)">
        <rect x="20" y="18" width="6" height="6" rx="1.5" />
        <rect x="30" y="18" width="6" height="6" rx="1.5" />
        <rect x="40" y="18" width="6" height="6" rx="1.5" />
        <rect x="20" y="28" width="6" height="6" rx="1.5" />
        <rect x="40" y="28" width="6" height="6" rx="1.5" />
        <rect x="20" y="38" width="6" height="6" rx="1.5" />
        <rect x="30" y="38" width="6" height="6" rx="1.5" />
        <rect x="40" y="38" width="6" height="6" rx="1.5" />
        <rect x="20" y="48" width="6" height="6" rx="1.5" />
        <rect x="20" y="58" width="6" height="6" rx="1.5" />
      </g>
      <rect x="65" y="22" width="125" height="8" rx="4" fill="oklch(0.35 0.02 25)" />
      <rect x="65" y="38" width="100" height="6" rx="3" fill="oklch(0.55 0.02 25)" opacity="0.7" />
      <rect x="65" y="52" width="115" height="6" rx="3" fill="oklch(0.55 0.02 25)" opacity="0.7" />
    </g>
  </g>
</svg>
