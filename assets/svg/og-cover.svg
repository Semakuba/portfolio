<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Dégradé principal Terre Cuite -->
    <linearGradient id="terracotta-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a3c22"/>
      <stop offset="50%" stop-color="#a85032"/>
      <stop offset="100%" stop-color="#b65c3e"/>
    </linearGradient>

    <!-- Halo d'ambiance supérieur -->
    <radialGradient id="ambient-glow" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#d9724e" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#a85032" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#8a3c22" stop-opacity="0"/>
    </radialGradient>

    <!-- Halo badge monogramme -->
    <radialGradient id="badge-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </radialGradient>

    <!-- Ombre douce badge -->
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#4a1c0d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Fond Terre Cuite -->
  <rect width="1200" height="630" fill="url(#terracotta-grad)"/>

  <!-- Halo d'ambiance -->
  <rect width="1200" height="630" fill="url(#ambient-glow)"/>

  <!-- Grille géométrique discrète d'arrière-plan -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="315" x2="1200" y2="315"/>
    <line x1="0" y1="510" x2="1200" y2="510"/>
  </g>

  <!-- Cadre intérieur élégant -->
  <rect x="36" y="36" width="1128" height="558" rx="24"
        fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="1.5"/>

  <!-- Badge Monogramme "SD" -->
  <g transform="translate(600, 205)" filter="url(#soft-shadow)">
    <!-- Fond du badge -->
    <rect x="-65" y="-65" width="130" height="130" rx="36"
          fill="url(#badge-glow)" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
    
    <!-- Monogramme SD -->
    <text x="0" y="8"
          font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
          font-size="54"
          font-weight="700"
          letter-spacing="2"
          fill="#ffffff"
          text-anchor="middle"
          dominant-baseline="middle">SD</text>
  </g>

  <!-- Nom d'auteur -->
  <text x="600" y="355"
        font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="46"
        font-weight="700"
        letter-spacing="-0.5"
        fill="#ffffff"
        text-anchor="middle">Semakuba David</text>

  <!-- Ligne séparatrice subtile -->
  <line x1="540" y1="388" x2="660" y2="388"
        stroke="#ffffff" stroke-opacity="0.25" stroke-width="2" stroke-linecap="round"/>

  <!-- Sous-titre / Spécialité -->
  <text x="600" y="432"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif"
        font-size="24"
        font-weight="500"
        letter-spacing="0.2"
        fill="#ffffff"
        fill-opacity="0.9"
        text-anchor="middle">Développeur web et applications</text>

  <!-- Badges technologiques -->
  <g transform="translate(600, 490)">
    <!-- PHP -->
    <g transform="translate(-180, 0)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="0" y="1" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" dominant-baseline="middle">PHP</text>
    </g>
    <!-- Java -->
    <g transform="translate(-60, 0)">
      <rect x="-42" y="-16" width="84" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="0" y="1" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" dominant-baseline="middle">Java</text>
    </g>
    <!-- Kotlin -->
    <g transform="translate(60, 0)">
      <rect x="-44" y="-16" width="88" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="0" y="1" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" dominant-baseline="middle">Kotlin</text>
    </g>
    <!-- JavaScript -->
    <g transform="translate(185, 0)">
      <rect x="-55" y="-16" width="110" height="32" rx="16" fill="#ffffff" fill-opacity="0.1" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1"/>
      <text x="0" y="1" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#ffffff" fill-opacity="0.85" text-anchor="middle" dominant-baseline="middle">JavaScript</text>
    </g>
  </g>

  <!-- URL du portfolio en pied -->
  <text x="600" y="558"
        font-family="'Inter', monospace, sans-serif"
        font-size="15"
        font-weight="400"
        letter-spacing="1.2"
        fill="#ffffff"
        fill-opacity="0.55"
        text-anchor="middle">semakuba.ct.ws</text>
</svg>
